plugins {
    id 'java'
    id 'run.halo.plugin.devtools' version '0.8.0'
}

group 'io.github.jeronlgy.haloadmonition'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'
    implementation 'org.jsoup:jsoup'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('processResources') {
    from('ui/src/styles/content.css') {
        into 'static'
        rename { 'admonition.css' }
    }
    from('LICENSE') {
        into 'META-INF'
    }
    from('NOTICE') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    from('LICENSES') {
        into 'META-INF/LICENSES'
    }
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache(
        'This task invokes Task.project at execution time, which is not supported with configuration cache.'
    )
}

halo {
    version = '2.26'
}
